<svg width="128" height="128" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="nibLeft" x1="32" y1="18" x2="52" y2="65" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="25%" stop-color="#e2e8f0" />
            <stop offset="60%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#334155" />
        </linearGradient>
        <linearGradient id="nibRight" x1="68" y1="18" x2="48" y2="65" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#cbd5e1" />
            <stop offset="40%" stop-color="#64748b" />
            <stop offset="85%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </linearGradient>
        <linearGradient id="goldTrim" x1="35" y1="35" x2="65" y2="55" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="45%" stop-color="#eab308" />
            <stop offset="85%" stop-color="#ca8a04" />
            <stop offset="100%" stop-color="#854d0e" />
        </linearGradient>
        <linearGradient id="fluidTrail" x1="12" y1="88" x2="92" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="28%" stop-color="#2563eb" />
            <stop offset="65%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        <linearGradient id="trailAura" x1="10" y1="86" x2="90" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
        </linearGradient>
        <linearGradient id="specularFacet" x1="48" y1="14" x2="38" y2="45" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
            <stop offset="70%" stop-color="#ffffff" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="nibShadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="1.5" dy="3.5" stdDeviation="3" floodColor="#0f172a" floodOpacity="0.25" />
        </filter>
    </defs>

    {/* Luminous Glow */}
    <path d="M 12 80 C 22 93, 44 94, 58 82 C 72 70, 78 50, 70 38 C 64 28, 48 30, 46 42 C 44 54, 54 64, 66 62 C 78 60, 88 48, 92 36" stroke="url(#trailAura)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#ambientGlow)" />

    {/* Ribbon */}
    <path d="M 14 78 C 24 88, 44 90, 56 80 C 68 70, 74 52, 68 40 C 62 32, 50 34, 48 44 C 46 54, 54 62, 64 60 C 74 58, 84 48, 88 38" stroke="url(#fluidTrail)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 17 76 C 26 84, 42 86, 54 78 C 64 70, 70 54, 66 42 C 62 36, 52 38, 50 46" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" opacity="0.75" />

    {/* Drops */}
    <circle cx="21" cy="65" r="2.6" fill="#2563eb" />
    <circle cx="85" cy="27" r="3.2" fill="#ec4899" />
    <circle cx="90" cy="46" r="1.8" fill="#7c3aed" />

    {/* Fountain Pen Nib */}
    <g filter="url(#nibShadow)" transform="translate(3.5, -2)">
        <path d="M 50 14 L 33 46 C 35 56, 38 60, 44 64 L 50 65 Z" fill="url(#nibLeft)" />
        <path d="M 50 14 L 67 46 C 65 56, 62 60, 56 64 L 50 65 Z" fill="url(#nibRight)" />
        <path d="M 50 14 L 37 44 L 43 45 L 50 20 Z" fill="url(#specularFacet)" />
        <path d="M 37 47 C 42 53, 46 54, 50 54 C 54 54, 58 53, 63 47" stroke="url(#goldTrim)" stroke-width="1.8" stroke-linecap="round" fill="none" />
        <line x1="50" y1="14" x2="50" y2="42" stroke="#020617" stroke-width="1.3" stroke-linecap="round" />
        <line x1="50" y1="18" x2="50" y2="38" stroke="#2563eb" stroke-width="0.6" stroke-linecap="round" opacity="0.8" />
        <circle cx="50" cy="43" r="2.8" fill="#0f172a" stroke="url(#goldTrim)" stroke-width="0.9" />
        <polygon points="48.5,14 51.5,14 50,11" fill="#ffffff" />
        <circle cx="50" cy="12" r="2" fill="#38bdf8" />
    </g>
</svg>
